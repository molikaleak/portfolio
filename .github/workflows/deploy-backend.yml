name: Deploy Backend to Render

on:
  workflow_run:
    workflows: ["Build and Push Backend to GHCR"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install curl
        run: |
          echo "Checking for curl..."
          # Check if curl is already installed
          if command -v curl &> /dev/null; then
            echo "✓ curl is already installed"
            curl --version
          else
            echo "Installing curl..."
            # Clean any existing apt locks
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock* 2>/dev/null || true
            # Update and install curl with retry
            for i in {1..3}; do
              echo "Attempt $i to install curl..."
              sudo apt-get update && sudo apt-get install -y curl && break
              sleep 5
            done
            # Verify installation
            if command -v curl &> /dev/null; then
              echo "✓ curl installed successfully"
              curl --version
            else
              echo "⚠ Failed to install curl. Trying alternative method..."
              # Try installing using apt-get without update
              sudo apt-get install -y --no-install-recommends curl || echo "Installation failed"
            fi
          fi

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deployment..."
          
          # Trigger Render deployment via API
          curl -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{
              "clearCache": "do_not_clear"
            }'
          
          echo "Render deployment triggered successfully"

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30
          echo "Deployment should be in progress. Check Render dashboard for status."